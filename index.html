<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #f5f0eb;
    min-height: 100vh;
    padding: 20px;
  }
  header { text-align: center; padding: 20px 0 28px; }
  header h1 { font-size: 20px; color: #3b2e2e; letter-spacing: 2px; font-weight: 600; }
  header p { font-size: 12px; color: #9e8a7e; margin-top: 4px; letter-spacing: 1px; }
  .date-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px; }
  .date-nav button { background: none; border: 1px solid #c9b8a8; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; color: #6b5344; }
  .date-nav .date-label { font-size: 15px; font-weight: 600; color: #3b2e2e; min-width: 130px; text-align: center; }
  .today-btn { font-size: 11px; padding: 4px 10px; border: 1px solid #c9b8a8; border-radius: 12px; background: white; color: #6b5344; cursor: pointer; }
  .staff-grid { display: flex; flex-direction: column; gap: 12px; max-width: 480px; margin: 0 auto; }
  .staff-card { background: white; border-radius: 16px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .staff-card.me { box-shadow: 0 2px 8px rgba(0,0,0,0.06), inset 4px 0 0 #4caf50; }
  .staff-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .staff-name { font-size: 16px; font-weight: 600; color: #3b2e2e; }
  .staff-role { font-size: 11px; color: #9e8a7e; margin-top: 2px; }
  .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
  .status-off    { background: #f0ebe5; color: #9e8a7e; }
  .status-in     { background: #e8f5e9; color: #388e3c; }
  .status-break  { background: #fff3e0; color: #ef6c00; }
  .status-out    { background: #e3f2fd; color: #1565c0; }
  .status-miss   { background: #ffebee; color: #c62828; }
  .time-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .time-box { flex: 1; background: #faf8f5; border-radius: 10px; padding: 10px 12px; text-align: center; }
  .time-box label { font-size: 10px; color: #9e8a7e; display: block; margin-bottom: 4px; letter-spacing: 0.5px; }
  .time-box .time-val { font-size: 18px; font-weight: 700; color: #3b2e2e; letter-spacing: 1px; }
  .time-box .time-val.empty { color: #d4c5b8; font-size: 14px; font-weight: 400; }
  .time-box.break-box { background: #fdf6ee; }
  .time-box.break-box .time-val { color: #ef6c00; }
  .time-box.actual-box { background: #f0f4ee; }
  .time-box.actual-box .time-val { color: #4a7c2f; }
  .break-detail { background: #fdf6ee; border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 11px; color: #b07d4a; }

  .break-detail .break-line:not(:last-child) { border-bottom: 1px dashed #f0e0cd; }
  .loc-line { font-size: 10.5px; color: #9e8a7e; margin: -2px 0 10px; text-align: center; }
  .loc-line b { color: #4a7c2f; font-weight: 600; }
  .loc-line .warn { color: #c62828; font-weight: 600; }
  .btn-row { display: flex; gap: 8px; }

  .btn { flex: 1; padding: 11px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; letter-spacing: 0.5px; font-family: inherit; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn-in  { background: #4caf50; color: white; }
  .btn-out { background: #2196f3; color: white; }
  .btn-break-start { background: #ff9800; color: white; }
  .btn-break-end   { background: #f57c00; color: white; }
  .btn-reset { background: #f5f0eb; color: #9e8a7e; border: 1px solid #e0d5cc; flex: 0 0 auto; padding: 11px 14px; }
  .btn-fix { background: #fff; color: #c62828; border: 1.5px solid #f3c9c9; }

  .memo-row input:focus { border-color: #c9b8a8; }
  .log-section { max-width: 480px; margin: 24px auto 0; background: white; border-radius: 16px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .log-section h3 { font-size: 13px; color: #9e8a7e; margin-bottom: 12px; letter-spacing: 1px; }

  .log-name { color: #3b2e2e; font-weight: 500; flex: 0 0 56px; }
  .log-detail { color: #9e8a7e; font-size: 12px; flex: 1; text-align: center; }
  .log-break { color: #ef6c00; font-size: 11px; flex: 0 0 auto; margin-right: 10px; }
  .log-hours { color: #6b5344; font-weight: 600; flex: 0 0 auto; }
  .no-log { color: #d4c5b8; font-size: 13px; text-align: center; padding: 12px 0; }
  .conn-status { text-align: center; font-size: 11px; margin-bottom: 16px; padding: 6px; border-radius: 8px; }
  .conn-ok  { color: #4caf50; background: #e8f5e9; }
  .conn-err { color: #f44336; background: #ffebee; }
  .conn-ing { color: #ff9800; background: #fff3e0; }
  .sync-time { text-align: center; font-size: 10px; color: #c9b8a8; margin-top: 16px; margin-bottom: 8px; }
  .location-status { text-align: center; font-size: 11px; margin: 0 auto 12px; padding: 6px 12px; border-radius: 8px; max-width: 480px; }
  .loc-ok      { color: #4caf50; background: #e8f5e9; }
  .loc-far     { color: #f44336; background: #ffebee; }
  .loc-loading { color: #ff9800; background: #fff3e0; }
  .loc-error   { color: #9e8a7e; background: #f5f0eb; }

  /* ── 앱 이동 ── */
  .applinks { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; max-width: 480px; margin: 0 auto 14px; }
  .applinks a { display: inline-flex; align-items: center; gap: 5px; padding: 9px 14px; border-radius: 999px;
                border: 1.5px solid #e0d5cc; background: #fff; color: #9e8a7e;
                font-family: inherit; font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .applinks a:active { background: #3b2e2e; color: #fff; border-color: #3b2e2e; }

  /* ── 퇴근 미기록 알림 ── */
  .missbox { max-width: 480px; margin: 0 auto 14px; background: #fff4f4; border: 1.5px solid #f3c9c9;
             border-radius: 14px; padding: 13px 16px; }
  .missbox h4 { font-size: 12.5px; color: #c62828; margin-bottom: 7px; font-weight: 700; }
  .missbox .mrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; color: #7a3330; }
  .missbox .mrow b { font-weight: 700; }
  .missbox .go { margin-left: auto; font-size: 11px; padding: 5px 11px; border-radius: 8px;
                 border: 1px solid #f3c9c9; background: #fff; color: #c62828; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .missbox .hint { font-size: 11px; color: #b07d7d; margin-top: 6px; line-height: 1.5; }

  @media (min-width:768px){
    body{padding:24px 32px}
    .staff-grid{max-width:720px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .log-section,.location-status,.applinks,.missbox{max-width:720px}

  @media (min-width:1024px){
    body{padding:28px 40px}
    .staff-grid{max-width:1040px;grid-template-columns:repeat(3,1fr);gap:16px}
    .log-section,.location-status,.applinks,.missbox{max-width:1040px}
    .date-nav{max-width:1040px;margin-left:auto;margin-right:auto}
    header h1{font-size:26px}
  }
  @media (min-width:1440px){
    .staff-grid{max-width:1280px;grid-template-columns:repeat(4,1fr)}
    .log-section,.location-status,.date-nav,.applinks,.missbox{max-width:1280px}
  }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA0nJAcOV64dq2QT2BVSsGxis99VTA2eEI",
  authDomain: "laurel-studio.firebaseapp.com",
  databaseURL: "https://laurel-studio-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "laurel-studio",
  storageBucket: "laurel-studio.firebasestorage.app",
  messagingSenderId: "516403607342",
  appId: "1:516403607342:web:5389cdfe397afcee1cacbf",
  measurementId: "G-JXJVBBYW9P"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ═══════════ 🔒 로그인 관문 ═══════════
   매장 계정으로 로그인해야만 아래 코드가 실행됩니다.
   비밀번호를 바꾸면 기존에 열어둔 사람들도 전부 자동으로 로그아웃됩니다. */
const auth = getAuth(app);

await (async function requireLogin(){
  await setPersistence(auth, browserLocalPersistence);   // 한 번 로그인하면 브라우저가 기억

  const already = await new Promise(function(res){
    const stop = onAuthStateChanged(auth, function(u){ stop(); res(u); });
  });
  if(already){ mountSignOut(); return; }

  const box = document.createElement('div');
  box.id = 'laurel-login';
  box.innerHTML = '<style>'
    + '#laurel-login{position:fixed;inset:0;z-index:99999;background:#faf9f7;display:flex;align-items:center;justify-content:center;padding:20px;'
    + 'font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}'
    + '#laurel-login .card{width:100%;max-width:340px;background:#fff;border:1px solid #e5e1da;border-radius:10px;padding:32px 26px;box-shadow:0 2px 14px rgba(0,0,0,.05);}'
    + '#laurel-login h1{font-size:17px;margin:0 0 4px;color:#2f2b26;letter-spacing:.3px;}'
    + '#laurel-login p.sub{font-size:12.5px;color:#8c857c;margin:0 0 22px;}'
    + '#laurel-login label{display:block;font-size:11.5px;color:#8c857c;margin:0 0 5px;}'
    + '#laurel-login input{width:100%;box-sizing:border-box;padding:11px 12px;font-size:15px;border:1px solid #ded9d1;border-radius:6px;margin-bottom:14px;font-family:inherit;background:#fff;color:#2f2b26;}'
    + '#laurel-login input:focus{outline:none;border-color:#a89880;}'
    + '#laurel-login button{width:100%;padding:12px;font-size:14.5px;border:0;border-radius:6px;background:#3f3a33;color:#fff;cursor:pointer;font-family:inherit;}'
    + '#laurel-login button:disabled{opacity:.55;cursor:default;}'
    + '#laurel-login .err{font-size:12.5px;color:#c0392b;min-height:17px;margin-top:11px;line-height:1.45;}'
    + '</style>'
    + '<div class="card">'
    + '<h1>Laurel Studio</h1>'
    + '<p class="sub">매장 계정으로 로그인해 주세요</p>'
    + '<label>이메일</label><input id="lg-id" type="email" autocomplete="username" autocapitalize="off" spellcheck="false">'
    + '<label>비밀번호</label><input id="lg-pw" type="password" autocomplete="current-password">'
    + '<button id="lg-go">로그인</button>'
    + '<div class="err" id="lg-err"></div>'
    + '</div>';
  document.body.appendChild(box);

  const idEl = box.querySelector('#lg-id');
  const pwEl = box.querySelector('#lg-pw');
  const btn  = box.querySelector('#lg-go');
  const err  = box.querySelector('#lg-err');
  idEl.focus();

  await new Promise(function(done){
    async function attempt(){
      const id = idEl.value.trim(), pw = pwEl.value;
      if(!id || !pw){ err.textContent = '이메일과 비밀번호를 모두 입력해 주세요'; return; }
      btn.disabled = true; btn.textContent = '확인 중...'; err.textContent = '';
      try{
        await signInWithEmailAndPassword(auth, id, pw);
        box.remove();
        mountSignOut();
        done();
      }catch(e){
        const c = e && e.code || '';
        err.textContent =
          (c === 'auth/invalid-email')            ? '이메일 형식이 올바르지 않아요' :
          (c === 'auth/too-many-requests')        ? '시도가 너무 많아요 — 잠시 후 다시 해주세요' :

/* ═══════ 매장 위치 ═══════ */
const STUDIO_LAT = 37.555559;
const STUDIO_LNG = 126.920661;
const ALLOWED_RADIUS_M = 200;

let LOC = { ok:false, lat:null, lng:null, dist:null, err:null };   // 마지막 위치 상태

function calcDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function checkLocation() {
  const el = document.getElementById('locStatus');
  if (!navigator.geolocation) {
    LOC = { ok:false, lat:null, lng:null, dist:null, err:'미지원' };
    el.textContent = '📍 GPS를 지원하지 않는 기기 — 퇴근은 그대로 찍을 수 있어요';
    el.className = 'location-status loc-error';
    renderAll(); return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const d = calcDistance(pos.coords.latitude, pos.coords.longitude, STUDIO_LAT, STUDIO_LNG);
      const m = Math.round(d);
      LOC = { ok: d <= ALLOWED_RADIUS_M, lat: +pos.coords.latitude.toFixed(6),
              lng: +pos.coords.longitude.toFixed(6), dist: m, err: null };
      if (LOC.ok) {
        el.textContent = `✅ 매장 근처 확인 (${m}m) — 출퇴근 가능`;
        el.className = 'location-status loc-ok';
      } else {
        el.textContent = `🚫 매장에서 ${m}m 떨어져 있어요 — 출근 불가 (퇴근은 가능)`;
        el.className = 'location-status loc-far';
      }
      renderAll();
    },
    (err) => {
      LOC = { ok:false, lat:null, lng:null, dist:null, err: err.message || '위치 실패' };
      el.textContent = '📍 위치를 못 잡았어요 — 출근은 막히지만 퇴근은 찍을 수 있어요';
      el.className = 'location-status loc-error';
      renderAll();
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}
checkLocation();
setInterval(checkLocation, 30000);

/* 저장할 위치 조각 */
function locStamp() {
  return { lat: LOC.lat, lng: LOC.lng, dist: LOC.dist,
           inRange: !!LOC.ok, at: nowHHMM(), err: LOC.err || null };
}

async function sha(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

window.ctSave = async () => {
  const err = document.getElementById('ctE');
  const rows = Array.from(document.querySelectorAll('#ctList .ctrow'));
  const contract = {}, staff = {};
  let order = 0;
  for (const row of rows){
    const id   = row.getAttribute('data-id');
    const name = row.querySelector('[data-nm]').value.trim();
    const mode = row.querySelector('[data-mode]').value;
    const hrsV = row.querySelector('[data-hr]').value.trim();

      const h = parseFloat(hrsV);
      if (isNaN(h) || h < 0 || h > 400){ err.textContent = esc(name)+' 의 시간이 이상합니다'; return; }

      contract[id] = { mode: mode, hours: h };

    order += 1;
    const old = STAFF.find(x => x.id === id) || {};
    staff[id] = { name: name, init: (old.init || name.charAt(0)), order: order, active: true };

/* 퇴근은 위치를 못 잡아도 허용 — 대신 위치 상태를 그대로 남깁니다 */
window.clockOut = (staffId) => {
  const rec = dayData[staffId] || {};
  if (isOnBreak(rec)) { alert('☕ 휴식 중이에요. "휴식 종료"를 먼저 눌러주세요!'); return; }
  if (!LOC.ok) {
    const msg = LOC.dist != null
      ? `매장에서 ${LOC.dist}m 떨어져 있습니다.\n그래도 퇴근으로 기록할까요?\n(기록에 "매장 밖"으로 남습니다)`
      : `위치를 확인하지 못했습니다.\n그래도 퇴근으로 기록할까요?\n(기록에 "위치 확인 안 됨"으로 남습니다)`;
    if (!confirm(msg)) return;
  }
  if (!dayData[staffId]) dayData[staffId] = {};
  dayData[staffId].out    = nowHHMM();
  dayData[staffId].outLoc = locStamp();
  saveRecord(staffId); renderAll(); toast(stamp('퇴근'));
};

/* 지난 날짜 퇴근 시간 채워넣기 */
window.fixOut = (staffId) => {
  const s = staffForDay().find(x => x.id === staffId) || { name: staffId };
  const rec = dayData[staffId] || {};
  const v = prompt(`${s.name} — ${dateKey(currentDate)} 퇴근 시각을 입력해주세요.\n예) 18:30`,
                   rec.out || '18:00');
  if (v === null) return;
  const t = String(v).trim();
  if (!/^\d{1,2}:\d{2}$/.test(t)) { alert('시:분 형식으로 넣어주세요. 예) 18:30'); return; }
  const [h, m] = t.split(':').map(Number);
  if (h > 23 || m > 59) { alert('시간이 올바르지 않아요.'); return; }
  const hhmm = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  if (rec.in && toMin(hhmm) <= toMin(rec.in)) { alert('출근 시각보다 빠릅니다.'); return; }
  if (!dayData[staffId]) dayData[staffId] = {};
  dayData[staffId].out    = hhmm;
  dayData[staffId].outLoc = { lat:null, lng:null, dist:null, inRange:null, at:null, manual:true };
  saveRecord(staffId); renderAll();
};

/* ═══════ 휴식 ═══════ */
window.breakStart = (staffId) => {
  const rec = dayData[staffId] || {};
  if (!rec.in)  { alert('출근 후에 휴식을 시작할 수 있어요!'); return; }
  if (rec.out)  { alert('이미 퇴근한 기록이에요.'); return; }
  if (isOnBreak(rec)) { alert('이미 휴식 중이에요.'); return; }
  if (!dayData[staffId]) dayData[staffId] = {};
  if (!dayData[staffId].breaks) dayData[staffId].breaks = [];
  dayData[staffId].breaks.push({ start: nowHHMM(), end: null });
  saveRecord(staffId); renderAll(); toast(stamp('휴식 시작'));
};
window.breakEnd = (staffId) => {
  const rec = dayData[staffId] || {};
  if (!isOnBreak(rec)) { alert('진행 중인 휴식이 없어요.'); return; }
  rec.breaks[rec.breaks.length - 1].end = nowHHMM();
  saveRecord(staffId); renderAll(); toast(stamp('휴식 종료'));
};
function isOnBreak(rec) {
  if (!rec.breaks || !rec.breaks.length) return false;
  const last = rec.breaks[rec.breaks.length - 1];
  return !!(last && last.start && !last.end);
}

  const s = staffForDay().find(x => x.id === staffId) || { name: staffId };

/* ═══════ 시간 계산 ═══════ */
function nowHHMM() {
  const n = new Date();
  return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}
function toMin(hhmm) {
  if (!hhmm) return null;
  const p = String(hhmm).split(':'); const h = +p[0], m = +p[1];
  return (isNaN(h) || isNaN(m)) ? null : h*60 + m;
}
function fmtMin(diff) {
  if (diff == null || diff <= 0) return null;
  const h = Math.floor(diff/60), m = diff%60;
  if (h && m) return `${h}h ${m}m`;
  if (h)      return `${h}h`;
  return `${m}m`;
}
function totalBreakMin(rec) {
  if (!rec.breaks || !rec.breaks.length) return 0;
  let sum = 0;
  rec.breaks.forEach(b => {
    const s = toMin(b && b.start), e = toMin(b && b.end);
    if (s != null && e != null && e > s) sum += (e - s);
  });
  return sum;
}
function grossMin(rec) {
  const s = toMin(rec.in), e = toMin(rec.out);
  if (s == null || e == null || e <= s) return null;
  return e - s;
}
function actualMin(rec) {
  const g = grossMin(rec);
  return g == null ? null : Math.max(0, g - totalBreakMin(rec));
}
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  renderCards(); renderLog(); renderMissing();

function locText(rec) {
  const bits = [];
  if (rec.inLoc) {
    const L = rec.inLoc;
    bits.push('출근 ' + (L.inRange ? `<b>매장 안${L.dist!=null?' '+L.dist+'m':''}</b>`
                                   : `<span class="warn">${L.dist!=null?L.dist+'m 밖':'위치 없음'}</span>`));
  }
  if (rec.outLoc) {
    const L = rec.outLoc;
    bits.push('퇴근 ' + (L.manual ? '<span class="warn">직접 입력</span>'
              : (L.inRange ? `<b>매장 안${L.dist!=null?' '+L.dist+'m':''}</b>`
                           : `<span class="warn">${L.dist!=null?L.dist+'m 밖':'위치 없음'}</span>`)));
  }
  return bits.length ? `<div class="loc-line">📍 ${bits.join(' · ')}</div>` : '';
}

function renderCards() {
  const grid = document.getElementById('staffGrid');
  const today = isToday(currentDate);
  const past  = dateKey(currentDate) < dateKey(new Date());
  const html = [];

  staffForDay().forEach(s => {
    const rec = dayData[s.id] || {};
    const hasIn = !!rec.in, hasOut = !!rec.out, onBreak = isOnBreak(rec);

    let cls = 'status-off', txt = '미출근';
    if (hasIn && hasOut)  { cls='status-out';  txt='퇴근'; }
    else if (onBreak)     { cls='status-break';txt='휴식중'; }
    else if (hasIn && past){ cls='status-miss'; txt='퇴근 안 찍음'; }
    else if (hasIn)       { cls='status-in';   txt='근무중'; }

    const bMin = totalBreakMin(rec);
    const bStr = bMin > 0 ? fmtMin(bMin) : null;
    const aStr = fmtMin(actualMin(rec));

    let brk = '';
    if (rec.breaks && rec.breaks.length) {
      brk = '<div class="break-detail">' + rec.breaks.map((b, i) => {
        const s0 = toMin(b && b.start), e0 = toMin(b && b.end);
        const dur = (s0 != null && e0 != null && e0 > s0) ? fmtMin(e0 - s0) : '진행중';
        return `<div class="break-line"><span>☕ 휴식 ${i+1}</span>` +
               `<span>${esc(b.start||'?')} → ${esc(b.end||'진행중')} &nbsp;(${dur})</span></div>`;
      }).join('') + '</div>';
    }

    html.push(`
    <div class="staff-card${ME===s.id?' me':''}">
      <div class="staff-header">
        <div onclick="pickMe('${s.id}')" style="cursor:pointer">
          <div class="staff-name">${esc(s.name)}${ME===s.id?' <span style="font-size:11px;color:#4caf50">· 나</span>':''}</div>
          <div class="staff-role">${s.gone ? '이전 직원' : (ME===s.id ? '탭하면 해제' : '탭해서 내 카드로')}</div>
        </div>
        <span class="status-badge ${cls}">${txt}</span>
      </div>
      <div class="time-row">
        <div class="time-box"><label>출근</label>
          <div class="time-val ${hasIn?'':'empty'}">${esc(rec.in || '- -')}</div></div>
        <div class="time-box"><label>퇴근</label>
          <div class="time-val ${hasOut?'':'empty'}">${esc(rec.out || '- -')}</div></div>
      </div>
      <div class="time-row">
        <div class="time-box break-box"><label>휴식 합계</label>
          <div class="time-val ${bStr?'':'empty'}">${bStr || '- -'}</div></div>
        <div class="time-box actual-box"><label>실근무시간</label>
          <div class="time-val ${aStr?'':'empty'}">${aStr || '- -'}</div></div>
      </div>
      ${locText(rec)}
      ${brk}
      <div class="btn-row">
        <button class="btn btn-in"  onclick="clockIn('${s.id}')"  ${(!today||hasIn)?'disabled':''}>출근</button>
        <button class="btn btn-out" onclick="clockOut('${s.id}')" ${(!today||!hasIn||hasOut||onBreak)?'disabled':''}>퇴근</button>
        <button class="btn btn-reset" onclick="resetRecord('${s.id}')">↺</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-break-start" onclick="breakStart('${s.id}')" ${(!today||!hasIn||hasOut||onBreak)?'disabled':''}>휴식 시작</button>
        <button class="btn btn-break-end"   onclick="breakEnd('${s.id}')"   ${(!today||!onBreak)?'disabled':''}>휴식 종료</button>
      </div>
      ${(past && hasIn && !hasOut) ? `<div class="btn-row">
        <button class="btn btn-fix" onclick="fixOut('${s.id}')">퇴근 시각 직접 입력</button></div>` : ''}
      <div class="memo-row">
        <input type="text" placeholder="메모 (특이사항 등)" value="${esc(rec.memo||'')}"
          onblur="saveMemo('${s.id}', this.value)"
          onkeydown="if(event.key==='Enter') this.blur()">
      </div>
    </div>`);
  });
  grid.innerHTML = html.join('');
}

function renderLog() {
  const list = document.getElementById('logList');
  const rows = staffForDay().map(s => ({ ...s, rec: dayData[s.id] || {} }))
                            .filter(s => s.rec.in || s.rec.out);
  if (!rows.length) { list.innerHTML = '<p class="no-log">기록 없음</p>'; return; }
  list.innerHTML = rows.map(s => {
    const a = fmtMin(actualMin(s.rec));
    const bMin = totalBreakMin(s.rec);
    const onBreak = isOnBreak(s.rec);
    const detail = `${esc(s.rec.in||'?')} → ${esc(s.rec.out || (onBreak ? '휴식중' : '근무중'))}`;
    return `<div class="log-item">
      <span class="log-name">${esc(s.name)}</span>
      <span class="log-detail">${detail}</span>
      <span class="log-break">${bMin>0 ? '휴식 '+fmtMin(bMin) : ''}</span>
      <span class="log-hours">${a || (onBreak ? '휴식중' : '진행중')}</span>
    </div>`;
  }).join('');
}

/* ═══════ 최근 7일 퇴근 미기록 ═══════ */
let MISS = [];
function loadMissing() {
  const jobs = [];
  for (let i = 1; i <= 7; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dateKey(d);
    jobs.push(get(ref(db, `attendance/${k}`)).then(sn => ({ k, v: sn.val() || {} })).catch(() => ({ k, v:{} })));
  }
  Promise.all(jobs).then(res => {
    const out = [];
    res.forEach(({ k, v }) => {
      Object.keys(v).forEach(id => {
        const r = v[id] || {};
        if (r.in && !r.out) {
          const s = STAFF.find(x => x.id === id);
          out.push({ day: k, id, name: s ? s.name : (LEGACY[id] || id), in: r.in });
        }
      });
    });
    out.sort((a, b) => a.day < b.day ? 1 : -1);
    MISS = out;
    renderMissing();
  });
}
function renderMissing() {
  const box = document.getElementById('missBox');
  if (!BOSS || !MISS.length) { box.style.display = 'none'; return; }
  box.style.display = '';
  const rows = MISS.slice(0, 8).map(m =>
    `<div class="mrow"><b>${esc(m.name)}</b> · ${esc(m.day.slice(5))} ${esc(m.in)} 출근` +
    `<button class="go" onclick="goDate('${m.day}')">그날 보기</button></div>`).join('');
  box.innerHTML = `<h4>⏰ 퇴근을 안 찍은 기록이 ${MISS.length}건 있습니다</h4>${rows}` +
    `<div class="hint">그날로 이동해서 「퇴근 시각 직접 입력」으로 채워주세요. 안 채우면 근무시간이 계산되지 않습니다.</div>`;
}

/* ═══════ 월별 엑셀 — 원장 모드 전용 ═══════ */
function minOf(rec){ return actualMin(rec) ? (function(){
  const t = actualMin(rec); return t; })() : null; }

/* 그 달의 주(월~일) 목록 — 알바 주 기준 계산용 */
function weekList(y, m){
  const last = new Date(y, m+1, 0).getDate();
  const out = []; let no = 0;
  for (let d=1; d<=last; d++){
    const dt = new Date(y, m, d);
    if (d===1 || dt.getDay()===1){
      no += 1;
      out.push({ no:no, from:d, to:d });
    } else { out[out.length-1].to = d; }
  }
  out.forEach(w => { w.label = w.no+'주차\n'+(m+1)+'/'+w.from+'~'+(m+1)+'/'+w.to; });
  return out;
}
function weekNo(key){
  const d = new Date(key+'T00:00:00');
  const wl = weekList(d.getFullYear(), d.getMonth());
  const day = d.getDate();
  const hit = wl.find(w => day>=w.from && day<=w.to);
  return hit ? hit.no : 1;
}

window.exportMonth = async function(){
  if (!BOSS) return;
  const btn = document.getElementById('xlBtn');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ 만드는 중...';
  try{
    if (typeof ExcelJS === 'undefined') throw new Error('엑셀 라이브러리를 불러오지 못했습니다');
    const wage = parseInt(document.getElementById('xlWage').value) || 0;
    const y = currentDate.getFullYear(), m = currentDate.getMonth();
    const mk = y + '-' + String(m+1).padStart(2,'0');
    const days = new Date(y, m+1, 0).getDate();

    /* 그 달 기록을 한 번에 읽어옵니다 */
    const rows = [];
    const totals = {};
    for (let d=1; d<=days; d++){
      const key = mk + '-' + String(d).padStart(2,'0');
      let snap;
      try { snap = await get(ref(db, 'attendance/' + key)); } catch(e){ continue; }
      const v = (snap && snap.exists()) ? (snap.val()||{}) : {};
      Object.keys(v).forEach(sid => {
        const rec = v[sid] || {};
        if (!rec.in && !rec.out) return;
        const st = STAFF.find(x=>x.id===sid);
        const name = st ? st.name : (LEGACY[sid] || sid);
        const bMin = totalBreakMin(rec) || 0;
        const aMin = (function(){
          const inM = toMin(rec.in), outM = toMin(rec.out);
          if (inM==null || outM==null) return null;
          return Math.max(0, outM - inM - bMin);
        })();
        rows.push({ day:key, dow:['일','월','화','수','목','금','토'][new Date(key+'T00:00:00').getDay()],
          name:name, inT:rec.in||'', outT:rec.out||'', bMin:bMin, aMin:aMin,
          memo:rec.memo||'', loc:(rec.outLoc && rec.outLoc.ok===false) ? '매장 밖' : '' });
        const T = totals[name] || (totals[name] = { id:sid, work:0, days:0, miss:0, wk:{} });
        T.id = sid;
        if (aMin!=null){
          T.work += aMin; T.days += 1;
          const wn = weekNo(key);
          T.wk[wn] = (T.wk[wn]||0) + aMin;
        } else { T.miss += 1; }
      });
    }

    const wb = new ExcelJS.Workbook(); wb.creator='Laurel Studio';
    const ws = wb.addWorksheet('근태_'+mk);
    ws.views=[{showGridLines:false}];
    ws.mergeCells('A1:H1');
    const t = ws.getCell('A1');
    t.value = 'Laurel Studio — 근태 기록 ' + y + '년 ' + (m+1) + '월';
    t.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF3B2E2E'}};
    t.font={bold:true,color:{argb:'FFFFFFFF'},size:14,name:'Arial'};
    t.alignment={horizontal:'center',vertical:'middle'}; ws.getRow(1).height=30;

    const H=['날짜','요일','이름','출근','퇴근','휴식','근무시간','비고'];
    const W=[13,8,13,11,11,11,13,26];
    H.forEach((h,i)=>{ const c=ws.getCell(String.fromCharCode(65+i)+'2'); c.value=h;
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF6B5344'}};
      c.font={bold:true,color:{argb:'FFFFFFFF'},size:9,name:'Arial'};
      c.alignment={horizontal:'center',vertical:'middle'};
      ws.getColumn(i+1).width=W[i]; });
    ws.getRow(2).height=20;

    let r=3;
    rows.sort((a,b)=> a.day===b.day ? a.name.localeCompare(b.name) : a.day.localeCompare(b.day));
    rows.forEach(x=>{
      const miss = (!x.outT);
      const bg = miss ? 'FFFDECEC' : (r%2 ? 'FFFFFFFF' : 'FFFBF8F4');
      const put=(col,val,bold)=>{ const c=ws.getCell(col+r); c.value=val==null?'':val;
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};
        c.font={bold:!!bold,size:10,name:'Arial',color:{argb: miss?'FFB94040':'FF000000'}};
        c.alignment={horizontal:'center',vertical:'middle'}; };
      put('A', x.day.slice(5)); put('B', x.dow); put('C', x.name, true);
      put('D', x.inT); put('E', x.outT || '미입력', miss);
      put('F', x.bMin ? fmtMin(x.bMin) : '');
      put('G', x.aMin==null ? '' : fmtMin(x.aMin), true);
      const note = miss ? '퇴근 미입력 — 이 날은 합계에서 빠집니다' : '';
      const c=ws.getCell('H'+r); c.value = [note, x.loc, x.memo].filter(Boolean).join(' · ');
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};
      c.font={size:10,name:'Arial',color:{argb: miss?'FFB94040':'FF000000'}};
      c.alignment={horizontal:'left',vertical:'middle'};
      ws.getRow(r).height=17; r++;
    });

    /* 사람별 합계 */
    r += 1;
    function band(txt, span){
      ws.mergeCells('A'+r+':'+String.fromCharCode(64+span)+r);
      const c=ws.getCell('A'+r); c.value=txt;
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF3B2E2E'}};
      c.font={bold:true,color:{argb:'FFC9A84C'},size:11,name:'Arial'};
      c.alignment={horizontal:'center',vertical:'middle'}; ws.getRow(r).height=22; r++;
    }
    function head(cols){
      cols.forEach((h,i)=>{ const c=ws.getCell(String.fromCharCode(65+i)+r); c.value=h;
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF6B5344'}};
        c.font={bold:true,color:{argb:'FFFFFFFF'},size:9,name:'Arial'};
        c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; });
      ws.getRow(r).height=20; r++;
    }
    function line(vals, opt){
      vals.forEach((v,i)=>{ const c=ws.getCell(String.fromCharCode(65+i)+r);
        c.value = (v===undefined?'':v);
        const col = (opt && opt.colors && opt.colors[i]) || 'FF000000';
        c.font={bold:!!(opt && opt.bold && opt.bold.indexOf(i)>=0),size:10,name:'Arial',color:{argb:col}};
        c.alignment={horizontal:'center',vertical:'middle'};
        if (opt && opt.money === i) c.numFmt='#,##0"원"'; });
      ws.getRow(r).height=19; r++;
    }
    const names = Object.keys(totals).sort();
    const monthly = names.filter(n => (CT[totals[n].id]||{}).mode === 'month');
    const weekly  = names.filter(n => (CT[totals[n].id]||{}).mode === 'week');
    const none    = names.filter(n => !(CT[totals[n].id]||{}).mode);
    const diffTxt = d => (d===0 ? '0' : (d>0 ? '+'+fmtMin(d) : '-'+fmtMin(-d)));
    const diffCol = d => d>0 ? 'FF8A4A2E' : (d<0 ? 'FF2F6B8A' : 'FF000000');

    /* ── 직원 · 계약직 (월 기준) ── */
    if (monthly.length){
      band('👤 직원 · 계약직 — 월 기준', 6);
      head(['이름','월 기준','이달 근무','차이','지급액(원)','퇴근 미입력']);
      monthly.forEach(n=>{
        const T=totals[n], base=Math.round((CT[T.id].hours||0)*60), d=T.work-base;
        line([n, fmtMin(base), fmtMin(T.work)||'0', diffTxt(d),
              wage?Math.round(T.work/60*wage):0, T.miss?(T.miss+'일'):''],
             {bold:[0,2,3], money:4, colors:{3:diffCol(d), 5:T.miss?'FFB94040':'FF000000'}});
      });
      r++;
    }

    /* ── 알바 (주 기준) ── */
    if (weekly.length){
      const wks = weekList(y, m);
      band('🕐 알바 — 주 기준', 3 + wks.length + 1);
      head(['이름','주 기준','이달 합계'].concat(wks.map(w=>w.label)).concat(['퇴근 미입력']));
      weekly.forEach(n=>{
        const T=totals[n], base=Math.round((CT[T.id].hours||0)*60);
        const cells=[n, fmtMin(base), fmtMin(T.work)||'0'];
        const cols={};
        wks.forEach((w,i)=>{
          const got=T.wk[w.no]||0, d=got-base;
          cells.push(fmtMin(got)||'0');
          if (got||d) cols[3+i]=diffCol(d);
        });
        cells.push(T.miss?(T.miss+'일'):'');
        cols[3+wks.length]=T.miss?'FFB94040':'FF000000';
        line(cells,{bold:[0,2],colors:cols});
        /* 주별 차이 줄 */
        const dl=['','↳ 기준 대비',''];
        const dc={1:'FF7A726A'};
        wks.forEach((w,i)=>{ const got=T.wk[w.no]||0; const d=got-base;
          dl.push(got?diffTxt(d):'—'); dc[3+i]=got?diffCol(d):'FFB9B2A8'; });
        dl.push('');
        line(dl,{colors:dc});
      });
      r++;
    }

    /* ── 기준 미설정 ── */
    if (none.length){
      band('기준 미설정 — ⚙ 계약 기준에서 넣어주세요', 5);
      head(['이름','근무일수','이달 근무','지급액(원)','퇴근 미입력']);
      none.forEach(n=>{ const T=totals[n];
        line([n, T.days+'일', fmtMin(T.work)||'0', wage?Math.round(T.work/60*wage):0,
              T.miss?(T.miss+'일'):''],
             {bold:[0,2], money:3, colors:{4:T.miss?'FFB94040':'FF000000'}});
      });
      r++;
    }

    ws.mergeCells('A'+r+':H'+r);
    const nc=ws.getCell('A'+r);
    nc.value='※ 「차이」는 실제 근무시간에서 계약 기준을 뺀 값입니다. '
           + '＋는 더 일한 시간, －는 덜 일한 시간(조기 퇴근·단축 운영 포함)입니다. '
           + '퇴근을 안 찍은 날은 시간을 알 수 없어 합계에서 빠지며 맨 오른쪽에 일수로 표시됩니다 — '
           + '원장 모드에서 그 날짜로 가 「퇴근 시각 직접 입력」으로 채워주세요.';
    nc.font={size:9.5,name:'Arial',color:{argb:'FF7A726A'}};
    nc.alignment={horizontal:'left',vertical:'middle',wrapText:true};
    ws.getRow(r).height=32;

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='로렐_근태_'+mk+'.xlsx'; a.click();
    URL.revokeObjectURL(url);
    btn.textContent='✅ 받았습니다';
    setTimeout(()=>{ btn.textContent=old; btn.disabled=false; }, 2200);
  } catch(e){
    console.error(e);
    alert('엑셀을 만들지 못했습니다 — 인터넷을 확인하고 다시 눌러주세요');
    btn.textContent=old; btn.disabled=false;
  }
};

paintMode();
watchDay();
</script>
</body>
</html>
